name: Preview E2E

# Uruchamia się automatycznie, gdy integracja Vercel<->GitHub zgłosi, że
# deployment Preview (czyli deploy brancha innego niż produkcyjny) zakończył
# się sukcesem. Odpala testy e2e (Playwright) bezpośrednio na tym URL-u
# preview - to jest bramka, którą `push-master` czeka przed mergem do master.
#
# WYMAGANE sekrety repo (Settings -> Secrets and variables -> Actions):
#   TEST_EMAIL, TEST_PASSWORD - konto testowe w aplikacji (najlepiej dedykowane,
#     nie prawdziwy najemca/właściciel), używane do zalogowania w e2e.
# WYMAGANE: integracja Vercel dla GitHub musi tworzyć Deployment + Deployment
# Status w tym repo (domyślnie włączone przy podłączeniu repo do projektu Vercel).

on:
  deployment_status:

permissions:
  deployments: read
  contents: read

jobs:
  e2e:
    name: Playwright e2e @ Vercel Preview
    runs-on: ubuntu-latest
    # Odpal tylko dla udanych deployów Preview (czyli NIE Production, i nie failed/pending).
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production' &&
      github.event.deployment.environment != 'production'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # apt-get bywa niestabilny (np. "Hash Sum mismatch" przy pobieraniu
        # listy pakietów Google Chrome, gdy mirror aktualizuje się w trakcie
        # fetch'a) - to fluke infrastruktury, nie błąd w kodzie, więc robimy
        # kilka prób zanim uznamy krok za faktycznie nieudany.
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Próba $i nieudana, ponawiam za 10s..."
            sleep 10
          done
          exit 1

      - name: Uruchom testy e2e przeciwko Preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Upload raportu Playwright (na wypadek błędów)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
