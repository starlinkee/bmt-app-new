name: Preview E2E

# Uruchamia się automatycznie, gdy integracja Vercel<->GitHub zgłosi, że
# deployment Preview (czyli deploy brancha innego niż produkcyjny) zakończył
# się sukcesem. Odpala testy e2e (Playwright) bezpośrednio na tym URL-u
# preview - to jest bramka, którą `push-master` czeka przed mergem do master.
#
# WYMAGANE sekrety repo (Settings -> Secrets and variables -> Actions):
#   TEST_EMAIL, TEST_PASSWORD - konto testowe w aplikacji (najlepiej dedykowane,
#     nie prawdziwy najemca/właściciel), używane do zalogowania w e2e.
# WYMAGANE: integracja Vercel dla GitHub musi tworzyć Deployment + Deployment
# Status w tym repo (domyślnie włączone przy podłączeniu repo do projektu Vercel).

on:
  deployment_status:

permissions:
  deployments: read
  contents: read

jobs:
  e2e:
    name: Playwright e2e @ Vercel Preview
    runs-on: ubuntu-latest
    # Oficjalny obraz Playwrighta ma przeglądarki + wszystkie zależności
    # systemowe już zainstalowane - zero apt-get w trakcie joba (szybciej
    # i bez ryzyka fluke'ów typu "Hash Sum mismatch" z mirrora Google Chrome).
    # WAŻNE: tag obrazu musi się zgadzać z wersją "@playwright/test" w
    # package.json/package-lock.json - inaczej binarki przeglądarek w obrazie
    # nie będą pasować do zainstalowanego API testowego.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    # Odpal tylko dla udanych deployów Preview (czyli NIE Production, i nie failed/pending).
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production' &&
      github.event.deployment.environment != 'production'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # actions/setup-node cache:npm cache'uje tylko ~/.npm (paczki pobrane),
      # nie sam node_modules - node-pty i tak trzeba by przebudować za każdym
      # razem. Ten cache trzyma gotowy node_modules (włącznie ze zbudowanymi
      # binarkami natywnymi) kluczowany hashem package-lock.json - przy
      # niezmienionym lockfile omija i apt-get, i kompilację node-pty.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Obraz Playwrighta jest minimalny i nie ma kompilatora. Potrzebny jest
      # tylko do zbudowania node-pty (zależność workspace'u skill-runner) -
      # to lekki, stabilny apt-get z repo Ubuntu (nie mirror Google Chrome,
      # więc nie ma ryzyka "Hash Sum mismatch" jak przy przeglądarkach).
      # Pomijany, gdy cache node_modules trafił (patrz krok wyżej).
      - name: Zainstaluj toolchain do budowania natywnych modułów (node-pty)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: apt-get update && apt-get install -y --no-install-recommends python3 make g++

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Uruchom testy e2e przeciwko Preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # Omija ekran Vercel SSO (Deployment Protection) na Preview - patrz
          # sekret "Protection Bypass for Automation" w Project Settings na Vercelu.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload raportu Playwright (na wypadek błędów)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
