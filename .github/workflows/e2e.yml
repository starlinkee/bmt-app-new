name: E2E

# Testy Playwright na świeżym deploymencie PREVIEW z Vercela.
# Vercel po zbudowaniu deploya zgłasza do GitHuba zdarzenie `deployment_status`
# z jego adresem - dzięki temu nie trzeba odpytywać API Vercela ani mieć jego tokena.
# Uwaga: to zdarzenie generuje też stany pending/in_progress; job je pomija (`if`),
# więc przy sprawdzaniu wyniku ignoruj przebiegi ze statusem "skipped"
# (scripts/push-preview.sh już to robi).
# Ręczne uruchomienie (workflow_dispatch): `gh workflow run e2e.yml --ref dev -f base_url=<URL deploya preview>`
# - dla sytuacji, gdy integracja Vercel -> GitHub nie zgłosiła deployment_status.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL deploya preview (np. https://bmt-app-xxxx.vercel.app)
        required: true
        type: string

concurrency:
  group: e2e-${{ github.event.deployment.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: playwright (preview)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Ręczny run: base_url musi wskazywać deploy preview TEGO projektu, zanim cokolwiek użyje
      # sekretów (test dostaje login i bypass Deployment Protection). Wartość przez env, nie
      # wklejana w skrypt (injection).
      - name: Walidacja base_url
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: ${{ inputs.base_url }}
        shell: bash
        run: |
          # Cała wartość naraz (bash =~, nie grep per linia): wartość wieloliniowa nie przejdzie,
          # nawet gdy pierwsza linia jest poprawna.
          re='^https://bmt-app-[a-z0-9]+-vikbobinskijunk-4072s-projects\.vercel\.app/?$'
          if [[ "$BASE_URL" == *$'\n'* || "$BASE_URL" == *$'\r'* || ! "$BASE_URL" =~ $re ]]; then
            echo "::error::base_url niezgodny z wzorcem deployu preview projektu - odrzucono."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          # supabase-js (fabryki testów w e2e/support/db.ts) wymaga natywnego
          # WebSocket, czyli Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Testy e2e
        # Sekrety tylko w tym kroku (wcześniejsze kroki, w tym walidacja base_url, ich nie widzą).
        env:
          # Adres konkretnego deploya preview tego commita.
          E2E_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # Sekrety - GitHub → Settings → Secrets and variables → Actions.
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
        run: npm run test:e2e

      - name: Raport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
