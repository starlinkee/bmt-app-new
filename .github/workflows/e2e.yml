name: E2E

# Testy e2e standardowo chodzą LOKALNIE (scripts/push-preview.sh) - nie zużywają
# minut GitHub Actions. Ten workflow jest tylko ręcznym zapasem: Actions →
# E2E → Run workflow, z podanym adresem deploya preview.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Adres deploya preview z Vercela
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: playwright (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      # Sekrety - GitHub → Settings → Secrets and variables → Actions.
      VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
      E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # supabase-js (fabryki testów w e2e/support/db.ts) wymaga natywnego
          # WebSocket, czyli Node >= 22.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Raport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
